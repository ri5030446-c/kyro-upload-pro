<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyro Video Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }
    .processor-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .upload-zone {
      border: 2px dashed rgba(0,212,255,0.5);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(0,212,255,0.05);
    }
    .upload-zone:hover {
      border-color: rgba(0,212,255,0.8);
      background: rgba(0,212,255,0.1);
    }
    .upload-zone.dragover {
      border-color: rgba(0,212,255,1);
      background: rgba(0,212,255,0.15);
    }
    #videoInput { display: none; }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    .upload-text {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .upload-hint {
      font-size: 13px;
      color: #888;
    }
    .progress {
      margin-top: 20px;
      display: none;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #0099ff);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="processor-container">
    <h1 style="margin-bottom: 30px; text-align: center;">Video Processor</h1>
    
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📹</div>
      <div class="upload-text">Drop your video here or click to select</div>
      <div class="upload-hint">Supports MP4, MOV, WebM • Max 2GB</div>
      <input type="file" id="videoInput" accept="video/*">
    </div>

    <div class="progress" id="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Preparing...</div>
    </div>
  </div>

  <script src="processor.js"></script>
</body>
</html>
