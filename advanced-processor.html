<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyro Upload Pro - Advanced Processor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    .processor-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
      margin-bottom: 20px;
    }
    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 10px;
      padding: 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #f8f9ff;
    }
    .upload-area:hover {
      border-color: #764ba2;
      background: #f0f2ff;
    }
    .upload-area.dragover {
      border-color: #764ba2;
      background: #e8ebff;
      transform: scale(1.02);
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    .upload-text {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .upload-hint {
      font-size: 13px;
      color: #666;
    }
    #fileInput { display: none; }
    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }
    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    label {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    select, input {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 25px;
    }
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-process {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      grid-column: 1 / -1;
    }
    .btn-process:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }
    .btn-process:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-clear {
      background: #f0f0f0;
      color: #333;
    }
    .btn-clear:hover {
      background: #e0e0e0;
    }
    .progress-section {
      display: none;
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #eee;
    }
    .progress-section.active {
      display: block;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: #f0f0f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 13px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    .status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.active {
      display: block;
    }
    .status.info {
      background: #e3f2fd;
      color: #1976d2;
      border-left: 4px solid #1976d2;
    }
    .status.success {
      background: #e8f5e9;
      color: #388e3c;
      border-left: 4px solid #388e3c;
    }
    .status.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #c62828;
    }
    .video-info {
      background: #f8f9ff;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      display: none;
    }
    .video-info.active {
      display: block;
    }
    .info-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 15px;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: 600;
      color: #667eea;
    }
    .info-value {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 Kyro Upload Pro</h1>
      <p class="subtitle">Advanced Video Processor - 1080p 60FPS without loss</p>
    </div>

    <div class="processor-card">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📹</div>
        <div class="upload-text">Drop your video here or click to upload</div>
        <div class="upload-hint">Supports MP4, MOV, WebM • Maximum 2GB</div>
        <input type="file" id="fileInput" accept="video/*">
      </div>

      <div class="video-info" id="videoInfo"></div>

      <div class="settings" id="settings">
        <div class="setting-group">
          <label for="resolution">Output Resolution</label>
          <select id="resolution">
            <option value="1920x1080">1080p (1920x1080)</option>
            <option value="2560x1440">1440p (2560x1440)</option>
            <option value="3840x2160">4K (3840x2160)</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="fps">Target FPS</label>
          <select id="fps">
            <option value="30">30 FPS</option>
            <option value="60" selected>60 FPS</option>
            <option value="120">120 FPS</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="quality">Quality</label>
          <select id="quality">
            <option value="18" selected>High (CRF 18)</option>
            <option value="22">Medium (CRF 22)</option>
            <option value="28">Fast (CRF 28)</option>
          </select>
        </div>
        <div class="setting-group">
          <label for="interpolation">
            <input type="checkbox" id="interpolation" checked>
            Enable RIFE Interpolation
          </label>
        </div>
      </div>

      <div class="buttons">
        <button class="btn-clear" id="clearBtn">Clear</button>
        <button class="btn-process" id="processBtn" disabled>Process Video</button>
      </div>

      <div class="progress-section" id="progressSection">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">
          <span id="progressLabel">Initializing...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="status info active" id="status">Processing your video...</div>
      </div>
    </div>
  </div>

  <script src="advanced-processor.js"></script>
</body>
</html>
